version: "3.9"

services:
  
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  worker1:
    build: ./worker
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_ID=worker1
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker2:
    build: ./worker
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_ID=worker2
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker3:
    build: ./worker
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_ID=worker3
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped